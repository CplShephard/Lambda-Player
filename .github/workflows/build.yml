name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Use the Gradle Wrapper committed to the repository. It is configured
      # for Gradle 9.6.1, which satisfies Android Gradle Plugin 9.3.1.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          GRADLE_OPTS: -Xmx4096m -Dfile.encoding=UTF-8
          JAVA_OPTS: -Xmx4096m
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m\" assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: lambda-player-release
          path: app/build/outputs/apk/release/*.apk
