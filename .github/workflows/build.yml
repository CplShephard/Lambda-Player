name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # JDK 21: miuix-nav-android 0.9.4 is built for JVM 21, so the app must target 21 too.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Use the Gradle Wrapper committed to the repository. It is configured
      # for Gradle 9.6.1, which satisfies Android Gradle Plugin 9.3.1.
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: lambda-player-release
          path: app/build/outputs/apk/release/*.apk
